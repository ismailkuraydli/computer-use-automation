<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer-Use Automation</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #5558e0;
      --success: #22c55e;
      --failure: #ef4444;
      --warning: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    .header .model {
      font-size: 13px;
      color: var(--muted);
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    .tab {
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: var(--muted);
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .tab.active { color: var(--text); background: var(--accent); }
    .content { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 15px; margin-bottom: 16px; font-weight: 600; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    .row > div { flex: 1; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .checkbox-row label { margin: 0; cursor: pointer; }
    button {
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--border); }
    button.secondary:hover { background: #3a3d4a; }
    .log {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 12px;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log .line { color: #c8c8c8; }
    .log .success { color: var(--success); }
    .log .failure { color: var(--failure); }
    .log .warning { color: var(--warning); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
    td { color: var(--text); }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge.yes { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge.no { background: rgba(239,68,68,0.15); color: var(--failure); }
    .params-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .param-input { display: flex; gap: 8px; align-items: center; }
    .param-input label { margin: 0; min-width: 80px; }
    .result-box {
      padding: 16px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 14px;
    }
    .result-box.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .result-box.failure { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
    .artifact-select { display: flex; gap: 12px; margin-bottom: 16px; }
    .artifact-select select { flex: 1; }
    .loading { color: var(--muted); font-style: italic; }
    .empty { color: var(--muted); text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Computer-Use Automation</h1>
    <span class="model" id="model-info">Loading...</span>
    <div class="tabs">
      <div class="tab active" data-tab="discover">Discover</div>
      <div class="tab" data-tab="artifacts">Artifacts</div>
      <div class="tab" data-tab="replay">Replay</div>
      <div class="tab" data-tab="evidence">Evidence</div>
    </div>
  </div>

  <div class="content">
    <!-- Discover Tab -->
    <div class="panel active" id="panel-discover">
      <div class="card">
        <h2>Run Discovery</h2>
        <div class="row">
          <div>
            <label>Target URL</label>
            <input type="text" id="discover-target" value="https://www.wikipedia.org" placeholder="https://...">
          </div>
        </div>
        <div style="margin-bottom: 12px;">
          <label>Goal (natural language description of what to do)</label>
          <textarea id="discover-goal" placeholder="Find me the page on a certain topic. input will be the topic. for this test try bananas then set the appearance to small then standard then large..."></textarea>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="discover-headed" checked>
          <label for="discover-headed">Show browser (headed mode)</label>
        </div>
        <button id="discover-btn" onclick="runDiscover()">Run Discovery</button>
        <button class="secondary" onclick="loadExample()">Load Example Goal</button>
      </div>
      <div class="card" id="discover-log-card" style="display:none;">
        <h2>Discovery Output</h2>
        <div class="log" id="discover-log"></div>
      </div>
    </div>

    <!-- Artifacts Tab -->
    <div class="panel" id="panel-artifacts">
      <div class="card">
        <h2>Saved Artifacts</h2>
        <div class="artifact-select">
          <select id="artifact-name" onchange="loadArtifactVersions()">
            <option value="">Select artifact...</option>
          </select>
          <select id="artifact-version" onchange="loadArtifactDetail()">
            <option value="">Version...</option>
          </select>
        </div>
      </div>
      <div class="card" id="artifact-detail-card" style="display:none;">
        <h2 id="artifact-title">Artifact Details</h2>
        <div style="margin-bottom: 16px;">
          <strong>Capability:</strong> <span id="artifact-capability"></span><br>
          <strong>Params:</strong> <span id="artifact-params"></span><br>
          <strong>Outputs:</strong> <span id="artifact-outputs"></span>
        </div>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Action</th>
              <th>Target</th>
              <th>Value</th>
              <th>CSS Selector</th>
            </tr>
          </thead>
          <tbody id="artifact-steps"></tbody>
        </table>
      </div>
    </div>

    <!-- Replay Tab -->
    <div class="panel" id="panel-replay">
      <div class="card">
        <h2>Run Replay</h2>
        <div class="artifact-select">
          <select id="replay-artifact-name" onchange="loadReplayVersions()">
            <option value="">Select artifact...</option>
          </select>
          <select id="replay-artifact-version" onchange="loadReplayParams()">
            <option value="">Version...</option>
          </select>
        </div>
        <div class="row">
          <div>
            <label>Target URL</label>
            <input type="text" id="replay-target" value="https://www.wikipedia.org" placeholder="https://...">
          </div>
        </div>
        <div id="replay-params-container"></div>
        <div class="checkbox-row">
          <input type="checkbox" id="replay-headed" checked>
          <label for="replay-headed">Show browser (headed mode)</label>
        </div>
        <button id="replay-btn" onclick="runReplay()">Run Replay</button>
      </div>
      <div class="card" id="replay-log-card" style="display:none;">
        <h2>Replay Output</h2>
        <div class="log" id="replay-log"></div>
        <div id="replay-result"></div>
      </div>
    </div>

    <!-- Evidence Tab -->
    <div class="panel" id="panel-evidence">
      <div class="card">
        <h2>Evidence Runs</h2>
        <select id="evidence-select" onchange="loadEvidenceDetail()">
          <option value="">Select evidence run...</option>
        </select>
      </div>
      <div class="card" id="evidence-detail-card" style="display:none;">
        <h2 id="evidence-title">Evidence Detail</h2>
        <div id="evidence-steps"></div>
        <div id="evidence-screenshots" style="margin-top: 16px;"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Tab switching ---
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'artifacts') loadArtifactList();
        if (tab.dataset.tab === 'replay') loadReplayArtifactList();
        if (tab.dataset.tab === 'evidence') loadEvidenceList();
      });
    });

    // --- Config ---
    async function loadConfig() {
      const res = await fetch('/api/config');
      const data = await res.json();
      if (data.config) {
        document.getElementById('model-info').textContent =
          `${data.config.provider} / ${data.config.model}`;
      }
    }
    loadConfig();

    // --- Discover ---
    function loadExample() {
      document.getElementById('discover-goal').value =
        'Find me the page on a certain topic. input will be the topic. for this test try bananas then set the appearance to small then standard then large three times then set the width to standard then wide then back to standard. then set the color to automatic then light then dark. Then get me all the research text and give it to me as an output';
    }

    async function runDiscover() {
      const goal = document.getElementById('discover-goal').value.trim();
      const target = document.getElementById('discover-target').value.trim();
      const headed = document.getElementById('discover-headed').checked;

      if (!goal) { alert('Please enter a goal'); return; }

      const btn = document.getElementById('discover-btn');
      btn.disabled = true;
      btn.textContent = 'Running...';

      const logCard = document.getElementById('discover-log-card');
      const log = document.getElementById('discover-log');
      log.innerHTML = '';
      logCard.style.display = 'block';

      try {
        const res = await fetch('/api/discover', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal, target, headed }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          let eventType = '';
          for (const line of lines) {
            if (line.startsWith('event: ')) {
              eventType = line.slice(7);
            } else if (line.startsWith('data: ')) {
              const data = JSON.parse(line.slice(6));
              if (eventType === 'output') {
                const div = document.createElement('div');
                div.className = 'line';
                div.textContent = data.line;
                if (data.line.includes('Success: true') || data.line.includes('success')) {
                  div.className = 'line success';
                } else if (data.line.includes('failure') || data.line.includes('Error')) {
                  div.className = 'line failure';
                } else if (data.line.includes('warning') || data.line.includes('Warning')) {
                  div.className = 'line warning';
                }
                log.appendChild(div);
                log.scrollTop = log.scrollHeight;
              } else if (eventType === 'done') {
                const div = document.createElement('div');
                div.className = data.exitCode === 0 ? 'success' : 'failure';
                div.textContent = `\n--- Process exited with code ${data.exitCode} ---`;
                log.appendChild(div);
              }
            }
          }
        }
      } catch (e) {
        const div = document.createElement('div');
        div.className = 'failure';
        div.textContent = 'Error: ' + String(e);
        log.appendChild(div);
      }

      btn.disabled = false;
      btn.textContent = 'Run Discovery';
    }

    // --- Artifacts ---
    async function loadArtifactList() {
      const res = await fetch('/api/artifacts');
      const data = await res.json();
      const select = document.getElementById('artifact-name');
      select.innerHTML = '<option value="">Select artifact...</option>';
      for (const a of data.artifacts) {
        const opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = a.name;
        select.appendChild(opt);
      }
    }

    async function loadArtifactVersions() {
      const name = document.getElementById('artifact-name').value;
      const select = document.getElementById('artifact-version');
      select.innerHTML = '<option value="">Version...</option>';
      if (!name) return;

      const res = await fetch('/api/artifacts');
      const data = await res.json();
      const artifact = data.artifacts.find(a => a.name === name);
      if (artifact) {
        for (const v of artifact.versions) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        }
      }
    }

    async function loadArtifactDetail() {
      const name = document.getElementById('artifact-name').value;
      const version = document.getElementById('artifact-version').value;
      if (!name || !version) return;

      const res = await fetch(`/api/artifacts/${name}/${version}`);
      const artifact = await res.json();

      document.getElementById('artifact-detail-card').style.display = 'block';
      document.getElementById('artifact-title').textContent = `${name} / ${version}`;
      document.getElementById('artifact-capability').textContent = artifact.capability;
      document.getElementById('artifact-params').textContent =
        artifact.params.map(p => `${p.name} (${p.type}${p.required ? ', required' : ''})`).join(', ') || 'none';
      document.getElementById('artifact-outputs').textContent =
        artifact.outputs.map(o => `${o.name} (${o.type})`).join(', ') || 'none';

      const tbody = document.getElementById('artifact-steps');
      tbody.innerHTML = '';
      for (const step of artifact.steps) {
        const tr = document.createElement('tr');
        const css = step.target?.primary?.cssSelector;
        tr.innerHTML = `
          <td>${step.id}</td>
          <td>${step.action}</td>
          <td>${step.target?.primary?.role || ''}:${step.target?.primary?.name || ''}</td>
          <td>${step.value || ''}</td>
          <td>${css ? '<span class="badge yes">YES</span>' : '<span class="badge no">NO</span>'}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    // --- Replay ---
    async function loadReplayArtifactList() {
      const res = await fetch('/api/artifacts');
      const data = await res.json();
      const select = document.getElementById('replay-artifact-name');
      select.innerHTML = '<option value="">Select artifact...</option>';
      for (const a of data.artifacts) {
        const opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = a.name;
        select.appendChild(opt);
      }
    }

    async function loadReplayVersions() {
      const name = document.getElementById('replay-artifact-name').value;
      const select = document.getElementById('replay-artifact-version');
      select.innerHTML = '<option value="">Version...</option>';
      if (!name) return;

      const res = await fetch('/api/artifacts');
      const data = await res.json();
      const artifact = data.artifacts.find(a => a.name === name);
      if (artifact) {
        for (const v of artifact.versions) {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        }
      }
    }

    let currentReplayArtifact = null;

    async function loadReplayParams() {
      const name = document.getElementById('replay-artifact-name').value;
      const version = document.getElementById('replay-artifact-version').value;
      if (!name || !version) return;

      const res = await fetch(`/api/artifacts/${name}/${version}`);
      currentReplayArtifact = await res.json();

      const container = document.getElementById('replay-params-container');
      container.innerHTML = '';

      if (currentReplayArtifact.params && currentReplayArtifact.params.length > 0) {
        const label = document.createElement('label');
        label.textContent = 'Parameters';
        container.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'params-grid';

        for (const param of currentReplayArtifact.params) {
          const div = document.createElement('div');
          div.className = 'param-input';
          div.innerHTML = `
            <label>${param.name}</label>
            <input type="text" id="param-${param.name}" placeholder="${param.description || param.name}" value="">
          `;
          grid.appendChild(div);
        }
        container.appendChild(grid);
      }
    }

    async function runReplay() {
      const name = document.getElementById('replay-artifact-name').value;
      const version = document.getElementById('replay-artifact-version').value;
      const target = document.getElementById('replay-target').value.trim();
      const headed = document.getElementById('replay-headed').checked;

      if (!name || !version) { alert('Please select an artifact'); return; }
      if (!target) { alert('Please enter a target URL'); return; }

      const params = {};
      if (currentReplayArtifact?.params) {
        for (const param of currentReplayArtifact.params) {
          const val = document.getElementById(`param-${param.name}`)?.value?.trim();
          if (val) params[param.name] = val;
        }
      }

      const btn = document.getElementById('replay-btn');
      btn.disabled = true;
      btn.textContent = 'Running...';

      const logCard = document.getElementById('replay-log-card');
      const log = document.getElementById('replay-log');
      const resultDiv = document.getElementById('replay-result');
      log.innerHTML = '';
      resultDiv.innerHTML = '';
      logCard.style.display = 'block';

      const artifactPath = `./artifacts/${name}/${version}`;

      try {
        const res = await fetch('/api/replay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ artifact: artifactPath, params, target, headed }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          let eventType = '';
          for (const line of lines) {
            if (line.startsWith('event: ')) {
              eventType = line.slice(7);
            } else if (line.startsWith('data: ')) {
              const data = JSON.parse(line.slice(6));
              if (eventType === 'output') {
                const div = document.createElement('div');
                div.className = 'line';
                div.textContent = data.line;
                if (data.line.includes('Status: success') || data.line.includes('Success: true')) {
                  div.className = 'line success';
                } else if (data.line.includes('Status: failure') || data.line.includes('failure') || data.line.includes('Error')) {
                  div.className = 'line failure';
                } else if (data.line.includes('warning') || data.line.includes('Warning')) {
                  div.className = 'line warning';
                }
                log.appendChild(div);
                log.scrollTop = log.scrollHeight;
              } else if (eventType === 'done') {
                const div = document.createElement('div');
                div.className = data.exitCode === 0 ? 'success' : 'failure';
                div.textContent = `\n--- Process exited with code ${data.exitCode} ---`;
                log.appendChild(div);
              }
            }
          }
        }
      } catch (e) {
        const div = document.createElement('div');
        div.className = 'failure';
        div.textContent = 'Error: ' + String(e);
        log.appendChild(div);
      }

      btn.disabled = false;
      btn.textContent = 'Run Replay';
    }

    // --- Evidence ---
    async function loadEvidenceList() {
      const res = await fetch('/api/evidence');
      const data = await res.json();
      const select = document.getElementById('evidence-select');
      select.innerHTML = '<option value="">Select evidence run...</option>';
      for (const id of data.evidence) {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = id;
        select.appendChild(opt);
      }
    }

    async function loadEvidenceDetail() {
      const id = document.getElementById('evidence-select').value;
      if (!id) return;

      const res = await fetch(`/api/evidence/${id}`);
      const data = await res.json();

      document.getElementById('evidence-detail-card').style.display = 'block';
      document.getElementById('evidence-title').textContent = `Evidence: ${id}`;

      const stepsDiv = document.getElementById('evidence-steps');
      stepsDiv.innerHTML = '';

      if (data.files.runSummary) {
        const summary = data.files.runSummary;
        const success = summary.success;
        const box = document.createElement('div');
        box.className = `result-box ${success ? 'success' : 'failure'}`;
        box.innerHTML = `
          <strong>Status:</strong> ${success ? 'SUCCESS' : 'FAILURE'}<br>
          <strong>Steps:</strong> ${summary.totalSteps}<br>
          <strong>Goal:</strong> ${summary.goal || 'N/A'}<br>
          ${summary.outputs ? `<strong>Outputs:</strong> <pre>${JSON.stringify(summary.outputs, null, 2)}</pre>` : ''}
          ${summary.error ? `<strong>Error:</strong> ${summary.error}` : ''}
        `;
        stepsDiv.appendChild(box);
      }

      if (data.files.structuredLog) {
        const table = document.createElement('table');
        table.innerHTML = `
          <thead><tr><th>#</th><th>Action</th><th>Target</th><th>Result</th><th>URL</th></tr></thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');
        // Dedupe steps (replay logs checkpoints as separate entries)
        const seen = new Set();
        for (const step of data.files.structuredLog.steps) {
          const key = `${step.step}-${step.action}-${step.target}`;
          if (seen.has(key)) continue;
          seen.add(key);
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${step.step}</td>
            <td>${step.action}</td>
            <td>${(step.target || '').substring(0, 40)}</td>
            <td><span class="badge ${step.result === 'success' ? 'yes' : 'no'}">${step.result}</span></td>
            <td>${(step.url || '').substring(0, 50)}</td>
          `;
          tbody.appendChild(tr);
        }
        stepsDiv.appendChild(table);
      }

      const screenshotsDiv = document.getElementById('evidence-screenshots');
      screenshotsDiv.innerHTML = '';
      if (data.files.screenshots && data.files.screenshots.length > 0) {
        const label = document.createElement('label');
        label.textContent = 'Screenshots';
        screenshotsDiv.appendChild(label);

        for (const screenshot of data.files.screenshots) {
          const img = document.createElement('img');
          img.src = `/api/evidence/${id}/screenshots/${screenshot}`;
          img.style.cssText = 'width:100%;max-width:600px;border:1px solid var(--border);border-radius:6px;margin-top:8px;margin-bottom:8px;';
          screenshotsDiv.appendChild(img);
        }
      }
    }
  </script>
</body>
</html>
